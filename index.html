<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>JLTN Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GitHub Pages opens index.html at the site root: send visitors on to JLTN_WEBSITE (keeps ?query and #hash). On GitHub Pages the address
     shows without ".html" (…/JLTN_WEBSITE); elsewhere (a local server) the file name is used as is. -->
<meta http-equiv="refresh" content="0; url=JLTN_WEBSITE.html">
<script>location.replace((/\.github\.io$/.test(location.hostname) ? "JLTN_WEBSITE" : "JLTN_WEBSITE.html") + location.search + location.hash);</script>
</head>
<body>
<p><a href="JLTN_WEBSITE.html">Mở JLTN Web</a></p>
</body>
</html>
