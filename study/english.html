<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Study</title>
<style>
:root{--lime:#E1E622;--lime-soft:#F4F6CC;--ink:#111111;--mut:#6B6B5E;--line:#E2E2DA;--bg:#F2F2EC;--surface:#FFFFFF;--ok:#2E7D32;--ok-s:#E3F4E4;--bad:#C00000;--bad-s:#FBE3E3;--warn:#9A6A12;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.banner{background:var(--lime);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 20px rgba(120,125,0,.25)}
.banner .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.banner .brand{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.banner .mark{height:34px;width:auto;display:block}
.banner h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}
.banner .sub{font-size:12px;font-weight:600;color:#3A3A2A}
.banner .home{color:var(--ink);font-weight:700;font-size:13px;text-decoration:none;background:rgba(255,255,255,.55);padding:7px 14px;border-radius:999px}
.banner .home:hover{background:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .sp{flex:1}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.45);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:none;font:inherit;font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#111;color:var(--lime)}
.tabs button:not(.on):hover{background:rgba(255,255,255,.7)}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:600;color:#3A3A2A}
.chips span{background:rgba(255,255,255,.55);border-radius:999px;padding:4px 10px}.chips b{color:var(--ink)}
button{font:inherit;cursor:pointer}
.pri,.sec,.ghost{border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px}
.pri{background:#111;color:var(--lime)}.pri:hover{filter:brightness(1.25)}
.sec{background:var(--lime-soft);color:var(--ink)}.sec:hover{filter:brightness(.96)}
.banner .sec{background:rgba(255,255,255,.55)}
.ghost{background:none;color:var(--mut);padding:6px 10px}.ghost:hover{color:var(--ink);background:var(--lime-soft)}
.bad-b{background:var(--bad-s);color:var(--bad)}.ok-b{background:var(--ok-s);color:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
#sv{font-size:12px;font-weight:600;color:#3A3A2A;cursor:pointer}#sv:hover{text-decoration:underline}#sv.er{color:var(--bad)}
.card{background:var(--surface);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(60,62,0,.06),0 6px 18px rgba(60,62,0,.06)}
.card h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
label{font-size:12.5px;font-weight:600;color:var(--mut);display:inline-flex;gap:6px;align-items:center}
.banner label{color:#3A3A2A}
select,input,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
select{max-width:220px}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px var(--lime)}
input[type=range]{padding:0;accent-color:#111;width:110px}input[type=checkbox]{accent-color:#111;width:16px;height:16px;margin:0}
.mut{color:var(--mut);font-size:12.5px}
.vi{color:var(--mut);font-size:.9em;font-style:italic}
body:not(.show-vi) .vi{display:none}
.tab{display:none;flex-direction:column;gap:14px}.tab.on{display:flex}
/* dictation */
.play{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.bigplay{width:58px;height:58px;border-radius:50%;border:0;background:#111;color:var(--lime);font-size:22px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2);flex:none}
.bigplay:hover{transform:scale(1.05)}
#dIn{width:100%;min-height:90px;font-size:17px;line-height:1.6;resize:vertical}
.hint{font:15px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);margin:8px 0 0;letter-spacing:.04em}
.res{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:17px;line-height:1.9}
.res .ok{color:var(--ok);font-weight:600}.res .miss{color:var(--bad);font-weight:700;background:var(--bad-s);border-radius:4px;padding:0 3px}.res .x{color:var(--mut);text-decoration:line-through}
.score{font-size:13px;font-weight:700;margin-bottom:4px}.score.perfect{color:var(--ok)}
.legend{font-size:11.5px;color:var(--mut);margin-top:6px}
details.card summary{cursor:pointer;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
details.card[open] summary{margin-bottom:12px}
textarea.my{width:100%;min-height:110px}
/* flashcards */
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--bg);border-radius:12px;padding:8px 14px;min-width:92px}.stat b{display:block;font-size:20px;line-height:1.1}.stat span{font-size:11.5px;color:var(--mut);font-weight:600}
.stat.hl{background:var(--lime-soft)}
.flash{margin-top:14px;min-height:220px;border-radius:16px;background:linear-gradient(160deg,#FCFCF4,#F4F6CC);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center}
.fc-top{align-self:stretch;display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:600}
.front{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.front.def{font-size:21px;font-weight:700}
.pos{font-size:12px;color:var(--mut);font-weight:600;font-style:italic}
.back{font-size:18px;font-weight:600}.ex{font-size:14.5px;color:#3A3A2A;font-style:italic;max-width:640px}
.spk{border:0;background:#111;color:var(--lime);width:30px;height:30px;border-radius:50%;font-size:13px;vertical-align:middle;flex:none}
.spk.sm{width:24px;height:24px;font-size:11px;background:var(--lime-soft);color:var(--ink)}
.fbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.fbtn button{min-width:130px}
.kb{font:11px ui-monospace,Menlo,Consolas,monospace;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6;margin-left:4px}
#fcIn{font-size:18px;text-align:center;width:min(420px,100%)}
.verdict{font-weight:800;font-size:15px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.done{font-size:16px;font-weight:700}
.tblw{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:12px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--lime-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
td.w{font-weight:700;white-space:nowrap}td.e{color:var(--mut);font-style:italic}
.lvl{display:inline-flex;gap:2px}.lvl i{width:7px;height:7px;border-radius:2px;background:var(--line)}.lvl i.f{background:#111}
form.add input{flex:1;min-width:150px}
/* side list + detail (grammar, listening) */
.gwrap{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.glist{display:flex;flex-direction:column;gap:6px}
.gi{border:1px solid transparent;background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:8px;align-items:center;box-shadow:0 1px 2px rgba(60,62,0,.06);font-weight:600}
.gi:hover{border-color:var(--line)}.gi.on{border-color:#111;box-shadow:0 0 0 3px var(--lime)}
.gi small{display:block;font-weight:600;color:var(--mut);font-size:11.5px}
.gi .ck{margin-left:auto;min-width:22px;height:22px;border-radius:999px;padding:0 6px;display:grid;place-items:center;font-size:11px;background:var(--bg);color:var(--mut);flex:none}
.gi .ck.y{background:var(--ok);color:#fff}
.gd h3{margin:0 0 6px;font-size:20px}
.form{background:#111;color:var(--lime);border-radius:10px;padding:8px 12px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.gd ul{margin:8px 0;padding-left:20px}.gd li{margin:3px 0}
.exs{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.exs div{background:var(--bg);border-radius:10px;padding:7px 10px;display:flex;gap:8px;align-items:center}
.qz{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:12px}
.qz .q{font-weight:600}.qz .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.qz .opts label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink);font-weight:600}
.qz .opts label.r{border-color:var(--ok);background:var(--ok-s);color:var(--ok)}.qz .opts label.w{border-color:var(--bad);background:var(--bad-s);color:var(--bad)}
.lvtag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--lime-soft)}
.lvtag.l2{background:#FFE9C7}.lvtag.l3{background:#FFD6D1}
/* listening player */
.lplayer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0 6px}
.lines{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:var(--bg);cursor:pointer;border:1px solid transparent}
.ln:hover{border-color:var(--line)}
.ln.cur{background:var(--lime-soft);border-color:#111}
.ln .who{font-weight:800;font-size:12px;min-width:72px;padding-top:2px}
.ln .who.b{color:#3B1FA8}
.ln .tx{flex:1;font-size:15px}
.ln .tx.hide{color:transparent;text-shadow:0 0 8px rgba(17,17,17,.45);user-select:none}
.ln .tx.hide .vi{display:none}
.k+.vi,.dhead .vi{margin-top:-6px;font-size:12px}
/* today */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:22px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.dhead .dt{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:2px}
.nav{display:flex;gap:6px;align-items:center}.nav button{width:34px;height:34px;padding:0;border-radius:50%}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.lc{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(60,62,0,.06),0 6px 18px rgba(60,62,0,.06);display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--lime)}
.lc .k{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.lc .big{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.lc .mean{font-weight:600}
.lc .item+.item{border-top:1px dashed var(--line);padding-top:10px}
.lc .item{display:flex;flex-direction:column;gap:4px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;background:var(--lime-soft);border-radius:999px;padding:1px 9px}
.wrong{color:var(--bad);text-decoration:line-through;font-weight:600}.right{color:var(--ok);font-weight:700}
.mq{display:flex;flex-direction:column;gap:6px;margin-top:4px}.mq button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px}
.mq button:hover{border-color:var(--ink)}.mq button.r{border-color:var(--ok);background:var(--ok-s);color:var(--ok)}.mq button.w{border-color:var(--bad);background:var(--bad-s);color:var(--bad)}
.dfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:760px){.gwrap{grid-template-columns:1fr}.front{font-size:24px}.ln .who{min-width:56px}}
body.embed{padding-top:12px}

const GRAM=[
 {id:'g1',t:'Present simple vs present continuous',f:'S + V(s/es)            → habits, facts, timetables\nS + am/is/are + V-ing   → happening now or temporary',
  x:['Present simple: repeated actions, fixed schedules and general truths (usually, every day, always).','Present continuous: actions in progress right now or temporary situations (now, at the moment, this week).','State verbs (know, like, need, belong) are normally not used in the -ing form.'],
  ex:['The line usually starts at 7:30.','The operator is checking the fixture right now.','We need more samples.'],
  q:[['The line usually ___ at 7:30.',['starts','is starting'],0],['Look! The operator ___ the fixture now.',['checks','is checking'],1],['Water ___ at 100 degrees Celsius.',['boils','is boiling'],0]]},
 {id:'g2',t:'Past simple vs present perfect',f:'S + V2/ed                 → a finished time in the past\nS + have/has + V3/ed      → experience, or a result that matters now',
  x:['Past simple goes with a finished time: yesterday, last week, in 2023, ago.','Present perfect: no exact time, or a period that is not finished: ever, never, already, yet, so far, this year, since, for.'],
  ex:['I finished the report yesterday.','We have had three audits so far this year.','Have you ever been to the US office?'],
  q:[['I ___ the report yesterday.',['finished','have finished'],0],['We ___ three audits so far this year.',['had','have had'],1],['___ you ever ___ to the US office?',['Did … go','Have … been'],1]]},
 {id:'g3',t:'Future: will vs be going to',f:'will + V               → instant decisions, predictions, promises\nam/is/are going to + V → plans already made, predictions from evidence',
  x:['will: a decision made at the moment of speaking ("I\'ll call him"), promises and offers.','be going to: a plan decided before, or a prediction based on something you can see now.'],

 {id:'g4',t:'Passive voice',f:'S + be + V3/ed (+ by …)\nmodal + be + V3   ·   be being + V3',
  x:['Use the passive when the action matters more than who does it. It is very common in technical reports.','Change "be" for the tense: is/are (present), was/were (past), has been (present perfect), is being (continuous).'],

  x:['First conditional: a real condition with a possible result.','Second conditional: an imaginary situation. With "be", use "were" for all persons (If I were you…).'],

 {id:'g6',t:'Comparatives & superlatives',f:'short adjectives: -er than / the -est\nlong adjectives : more … than / the most …\nequal           : as + adjective + as',
  x:['One-syllable adjectives (and two-syllable ones ending in -y) add -er / -est: cheap → cheaper, easy → easier.','Longer adjectives use more / most. Irregular: good → better → best, bad → worse → worst.'],

 {id:'g7',t:'Much / many / a few / a little',f:'many, a few     + plural countable nouns\nmuch, a little  + uncountable nouns',
  x:['Countable: samples, units, parts → many / a few / few.','Uncountable: time, information, equipment, advice → much / a little / little.','"A few / a little" = some (enough); "few / little" = almost none (not enough).'],

 {id:'g8',t:'Relative clauses: who / which / that / whose',f:'who   → people\nwhich → things\nthat  → people or things (defining clauses)\nwhose → possession',

/* ================= state & storage (qe_data.json › eng) ================= */
const KEY='eng.v1',INT=[0,1,2,4,7,15],NEW_MAX=10;
const DEF=()=>({v:2,savedAt:0,start:0,done:{},srs:{},gram:{},listen:{},custom:{vocab:[],idiom:[],dict:''},stats:{days:{},dOk:0,dAll:0},opts:{tab:'today',lvl:'0',rate:.9,voice:'',voice2:'',vi:false,lsel:'l1',dir:{vocab:'en',idiom:'en'}}});
function fill(d){const b=DEF();if(!d||typeof d!=='object')return b;const o=d.opts||{};
 return Object.assign(b,d,{done:d.done||{},srs:d.srs||{},gram:d.gram||{},listen:d.listen||{},custom:Object.assign(b.custom,d.custom||{}),stats:Object.assign(b.stats,d.stats||{}),opts:Object.assign(b.opts,o,{dir:Object.assign(b.opts.dir,o.dir||{})})})}

const QE_FILE='qe_data.json',QE_OLD='bom_auto_data.json';
const qeDir=()=>new Promise(ok=>{try{const q=indexedDB.open('bom_auto',1);q.onupgradeneeded=()=>q.result.createObjectStore('d');q.onerror=()=>ok(null);
 q.onsuccess=()=>{try{const g=q.result.transaction('d').objectStore('d').get('dir');g.onsuccess=()=>ok(g.result||null);g.onerror=()=>ok(null)}catch(e){ok(null)}}}catch(e){ok(null)}});
async function qeRead(h){let fh=null;try{fh=await h.getFileHandle(QE_FILE)}catch(e){if(e.name!=='NotFoundError')throw e}
 if(fh)return JSON.parse(await (await fh.getFile()).text());                       /* a broken file throws, so nothing gets overwritten */
 try{const o=await h.getFileHandle(QE_OLD);return{ser:JSON.parse(await (await o.getFile()).text())}}catch(e){return null}}
async function qeWrite(h,key,val){const j=(await qeRead(h))||{};j.app='QE Dashboard';j.version=1;j.savedAt=new Date().toISOString();j[key]=val;   /* rewrite only this section */
 const w=await (await h.getFileHandle(QE_FILE,{create:true})).createWritable();await w.write(JSON.stringify(j));await w.close()}
async function qeHandle(ask){if(!window.indexedDB)return null;const h=await qeDir();if(!h)return null;let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted'&&ask)p=await h.requestPermission({mode:'readwrite'});return p==='granted'?h:null}
function svSet(t,c){const e=$('sv');e.textContent=t;e.className=c||''}

let st=0;function save(){clearTimeout(st);svSet('Saving…');st=setTimeout(()=>{S.savedAt=Date.now();if(HOST)HOST.save('eng',S);else try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}fileSave(false)},500)}
function bump(){const k=dayStr();S.stats.days[k]=(S.stats.days[k]||0)+1}
function streak(){const D=S.stats.days;let d=new Date(),n=0;if(!D[dayStr(d)])d.setDate(d.getDate()-1);while(D[dayStr(d)]){n++;d.setDate(d.getDate()-1)}return n}

/* ================= daily lessons (English_Daily_Bank.js) =================
   Day n takes the next items of each list in order; once a list runs out it starts again from the top (review round). */
const BK=Object.assign({words:[],idioms:[],phrasal:[],phrases:[],mistakes:[]},window.ENG_BANK||{});
const BW=BK.words.map(([w,p,m,v,e])=>({id:'b:'+w,w,p,m,v,e})),BI=BK.idioms.map(([w,m,v,e])=>({id:'bi:'+w,w,p:'idiom',m,v,e})),
 BP=BK.phrasal.map(([w,m,v,e])=>({id:'bp:'+w,w,p:'phrasal verb',m,v,e})),BS=BK.phrases.map(([w,v,c])=>({id:'bs:'+w,w,p:'phrase',m:c,v,e:'',c})),
 BM=BK.mistakes.map(([x,o,m],i)=>({id:'bm'+i,x,o,m}));
BS.forEach(x=>{if(x.v&&!VI[x.w])VI[x.w]=x.v});   /* work phrases carry their own translation */
const todayIdx=()=>Math.max(0,dayNum()-S.start);
const pick=(arr,per,i)=>{const o=[];if(arr.length)for(let j=0;j<per;j++)o.push(arr[(i*per+j)%arr.length]);return o};
const unlocked=(arr,per)=>arr.slice(0,Math.min(arr.length,(todayIdx()+1)*per));
const lesson=i=>({w:pick(BW,2,i),i:pick(BI,1,i)[0],p:pick(BP,1,i)[0],s:pick(BS,1,i)[0],m:pick(BM,1,i)[0]});
const lessonSentences=i=>{const L=lesson(i);return[...L.w.map(x=>x.e),L.i&&L.i.e,L.p&&L.p.e,L.s&&L.s.w].filter(Boolean).map((t,k)=>({id:'t'+k,l:'today',t}))};

function voiceOpts(sel,want,fallback){sel.innerHTML=VO.length?VO.map(v=>`<option value="${esc(v.name)}">${esc(v.name.replace(/^(Microsoft|Google)\s+/,'').replace(/\s*Online.*$/,''))} · ${esc(v.lang)}</option>`).join(''):'<option value="">(no English voice installed)</option>';
 if(want&&VO.some(v=>v.name===want))sel.value=want;else if(fallback)sel.value=fallback.name}
function loadVoices(){VO=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
 const d1=VO.find(v=>/en-US/i.test(v.lang))||VO[0],d2=VO.find(v=>v!==d1&&v.lang===(d1||{}).lang)||VO.find(v=>v!==d1)||d1;
 voiceOpts($('voice'),S.opts.voice,d1);voiceOpts($('voice2'),S.opts.voice2,d2)}
function utter(t,who,r){const u=new SpeechSynthesisUtterance(t);const v=VO.find(x=>x.name===$(who==='B'?'voice2':'voice').value);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=r||S.opts.rate;return u}
function say(t,r){if(!('speechSynthesis' in window)){alert('This browser cannot read text aloud.');return}speechSynthesis.cancel();lHl(-1);speechSynthesis.speak(utter(t,'A',r))}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}else{$('voice').innerHTML=$('voice2').innerHTML='<option>(not supported)</option>'}
$('voice').onchange=e=>{S.opts.voice=e.target.value;save()};$('voice2').onchange=e=>{S.opts.voice2=e.target.value;save()};

let DC=null,dChecked=false,dLast='';
function myDict(){return S.custom.dict.split('\n').map(s=>s.trim()).filter(Boolean).map((t,i)=>({id:'m'+i,l:'my',t}))}
function dPool(){const l=S.opts.lvl;if(l==='my')return myDict();if(l==='today')return lessonSentences(tView);
 if(l==='listen'){const L=LISTEN.find(x=>x.id===S.opts.lsel)||LISTEN[0];return L.lines.map(([,t],i)=>({id:'ls'+i,l:'listen',t}))}
 return l==='0'?DICT:DICT.filter(x=>String(x.l)===l)}
function dNext(){const p=dPool();if(!p.length){DC=null;$('dRes').innerHTML='<p class="mut">No sentences yet. Add some under “My sentences” below.</p>';return}
 let c;do{c=p[Math.random()*p.length|0]}while(p.length>1&&c.t===dLast);DC=c;dLast=c.t;dChecked=false;$('dIn').value='';$('dRes').innerHTML='';$('dHintT').hidden=true;
 $('dStat').textContent=`${p.length} sentence${p.length===1?'':'s'} at this level`;setTimeout(()=>say(DC.t),150);$('dIn').focus()}
function diff(target,input){const T=(target.match(/\S+/g)||[]).filter(w=>norm(w)),U=(input.match(/\S+/g)||[]).filter(w=>norm(w)),a=T.map(norm),b=U.map(norm),m=a.length,k=b.length;
 const L=Array.from({length:m+1},()=>new Uint16Array(k+1));
 for(let i=m-1;i>=0;i--)for(let j=k-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const out=[];let i=0,j=0,ok=0,extra=0;
 while(i<m||j<k){if(i<m&&j<k&&a[i]===b[j]){out.push(['ok',T[i]]);ok++;i++;j++}else if(j<k&&(i>=m||L[i][j+1]>=L[i+1][j])){out.push(['x',U[j]]);extra++;j++}else{out.push(['miss',T[i]]);i++}}
 return{out,ok,total:m,extra}}
function dCheck(){if(!DC)return;const v=$('dIn').value.trim();if(!v){$('dIn').focus();return}
 const r=diff(DC.t,v),pct=r.total?Math.round(r.ok/r.total*100):0,perfect=r.ok===r.total&&!r.extra;
 if(!dChecked){S.stats.dAll++;if(perfect)S.stats.dOk++;bump();save();chips()}dChecked=true;
 $('dRes').innerHTML=`<div class="res"><div class="score ${perfect?'perfect':''}">${perfect?'🎉 100% correct!':`${r.ok}/${r.total} words correct (${pct}%)`}</div>${r.out.map(([c,w])=>`<span class="${c}">${esc(w)}</span>`).join(' ')}
  <div class="legend"><span style="color:var(--ok)">green</span> = correct · <span style="color:var(--bad)">red</span> = missing or wrong (the right word) · <s>struck out</s> = extra or wrong word you typed</div>
  <div class="row" style="margin-top:8px">${spk(DC.t)}<span>${esc(DC.t)}${tv(DC.t)}</span></div></div>`}
$('dPlay').onclick=()=>DC?say(DC.t):dNext();$('dSlow').onclick=()=>DC&&say(DC.t,Math.max(.5,S.opts.rate-.3));
$('dHint').onclick=()=>{if(!DC)return;const h=$('dHintT');h.hidden=false;h.textContent=DC.t.split(/\s+/).map(w=>w.replace(/[A-Za-z0-9]/g,(c,i)=>i===0?c:'_')).join('  ')};
$('dChk').onclick=dCheck;$('dNext').onclick=dNext;
$('dShow').onclick=()=>{if(!DC)return;dChecked=true;$('dRes').innerHTML=`<div class="res"><div class="score">Answer</div>${spk(DC.t)} ${esc(DC.t)}${tv(DC.t)}</div>`};
$('dIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();dChecked?dNext():dCheck()}});
$('dLvl').value=S.opts.lvl;$('dLvl').onchange=e=>{S.opts.lvl=e.target.value;save();dNext()};

function deckStats(d){const t=dayNum(),all=decks(d);let nw=0,lr=0,ms=0,due=0;all.forEach(it=>{const s=S.srs[it.id];if(!s)nw++;else{if(s.b>=4)ms++;else lr++;if(s.due<=t)due++}});return{all:all.length,nw,lr,ms,due}}
function deckRender(d){const s=deckStats(d);
 $(d+'-st').innerHTML=`<div class="stat hl"><b>${s.due}</b><span>Due today</span></div><div class="stat"><b>${s.nw}</b><span>New</span></div><div class="stat"><b>${s.lr}</b><span>Learning</span></div><div class="stat"><b>${s.ms}</b><span>Mastered</span></div>`;
 if(!Q[d])$(d+'-fc').innerHTML=`<div class="done">${s.due?`<b>${s.due}</b> card${s.due===1?'':'s'} due`:'No cards due'}${s.nw?` and <b>${Math.min(NEW_MAX,s.nw)}</b> new card${Math.min(NEW_MAX,s.nw)===1?'':'s'}`:''}.</div><div class="mut">Click <b>▶ Start review</b>. “Got it” brings a card back after 1, 2, 4, 7 and 15 days; “Again” repeats it in this session.</div>`;
 listRender(d);chips()}
function listRender(d){const q=$(d+'-q').value.trim().toLowerCase(),all=decks(d).filter(it=>!q||(it.w+' '+it.m+' '+(it.v||'')).toLowerCase().includes(q));$(d+'-cnt').textContent=all.length+' items';
 $(d+'-tb').innerHTML=all.map(it=>{const b=(S.srs[it.id]||{}).b||0;return`<tr><td class="w">${spk(it.w,1)} ${esc(it.w)}${it.p&&it.p!=='idiom'?` <span class="pos">${esc(it.p)}</span>`:''}</td><td>${esc(it.m)}${viSpan(it.v)}</td><td class="e">${esc(it.e||'')}${it.e?tv(it.e):''}</td><td><span class="lvl" title="Level ${b}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?'f':''}"></i>`).join('')}</span></td><td>${it.my?`<button class="ghost" data-del="${esc(it.id)}" title="Delete">✕</button>`:''}</td></tr>`}).join('')}
function start(d){const t=dayNum(),all=decks(d),due=shuffle(all.filter(it=>S.srs[it.id]&&S.srs[it.id].due<=t)),nw=shuffle(all.filter(it=>!S.srs[it.id])).slice(0,NEW_MAX);
 Q[d]={list:due.concat(nw),i:0,shown:false,res:null,ok:0,n:due.length+nw.length};if(!Q[d].list.length){Q[d]=null;deckRender(d);return}flash(d)}
function flash(d){const q=Q[d],el=$(d+'-fc');if(!q)return deckRender(d);
 if(q.i>=q.list.length){Q[d]=null;deckRender(d);el.innerHTML=`<div class="done">🎉 Session complete: ${q.ok}/${q.n} cards remembered the first time.</div><div class="mut">Come back tomorrow to review the cards that are due.</div>`;return}
 const it=q.list[q.i],s=S.srs[it.id],dir=S.opts.dir[d],top=`<div class="fc-top"><span>${q.i+1} / ${q.list.length}</span><span>${s?'Level '+s.b+'/5':'New card'}</span></div>`;
 const meaning=`<div class="back">${esc(it.m)}</div>${viSpan(it.v)}`;
 if(dir==='en'){el.innerHTML=top+`<div class="front">${esc(it.w)} ${spk(it.w)}</div>${it.p&&it.p!=='idiom'?`<div class="pos">${esc(it.p)}</div>`:''}`+
  (q.shown?meaning+(it.e?`<div class="ex">${spk(it.e,1)} “${esc(it.e)}”</div>${tv(it.e)}`:'')+`<div class="fbtn"><button class="sec bad-b" data-a="no">✗ Again<span class="kb">1</span></button><button class="sec ok-b" data-a="yes">✓ Got it<span class="kb">2</span></button></div>`
   :`<div class="fbtn"><button class="pri" data-a="show">Show meaning<span class="kb">Space</span></button></div>`)}
 else{const clue=`<div class="front def">${esc(it.m)}</div>${viSpan(it.v)}`;
  if(!q.res){el.innerHTML=top+clue+`<input id="fcIn" autocomplete="off" spellcheck="false" placeholder="Type the English ${d==='idiom'?'idiom or phrase':'word'}…"><div class="fbtn"><button class="pri" data-a="chk">Check<span class="kb">Enter</span></button><button class="ghost" data-a="giveup">I don't know</button></div>`;
   const inp=$('fcIn');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();act(d,'chk')}}}
  else{el.innerHTML=top+clue+`<div class="verdict ${q.res.ok?'ok':'bad'}">${q.res.ok?'✓ Correct':'✗ Not quite'}${q.res.v&&!q.res.ok?` · you typed: “${esc(q.res.v)}”`:''}</div><div class="front">${esc(it.w)} ${spk(it.w)}</div>${it.e?`<div class="ex">${spk(it.e,1)} “${esc(it.e)}”</div>${tv(it.e)}`:''}<div class="fbtn"><button class="pri" data-a="next">Next<span class="kb">Enter</span></button></div>`}}}

 if(good){s.b=Math.min(5,s.b+1);s.due=t+INT[s.b];if(!q.miss||!q.miss[it.id])q.ok++}
 else{s.b=1;s.due=t;q.miss=q.miss||{};q.miss[it.id]=1;q.list.splice(Math.min(q.list.length,q.i+4),0,it)}   /* missed: comes back a few cards later */
 S.srs[it.id]=s;bump();save()}
function act(d,a){const q=Q[d];if(!q)return;const it=q.list[q.i];
 if(a==='show'){q.shown=true;say(it.w);flash(d)}
 else if(a==='yes'||a==='no'){grade(d,a==='yes');q.i++;q.shown=false;flash(d);chips()}
 else if(a==='chk'||a==='giveup'){const v=a==='giveup'?'':($('fcIn')||{}).value||'';if(a==='chk'&&!v.trim())return;
  const ok=a==='chk'&&norm(v.replace(/\s+/g,''))===norm(it.w.replace(/\s+/g,''));q.res={ok,v:v.trim()};grade(d,ok);say(it.w);flash(d);chips()}
 else if(a==='next'){q.res=null;q.i++;flash(d)}}
document.addEventListener('keydown',e=>{const t=S.opts.tab;if(t!=='vocab'&&t!=='idiom')return;const q=Q[t];if(!q)return;const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if(S.opts.dir[t]==='en'&&!typing){if(e.code==='Space'&&!q.shown){e.preventDefault();act(t,'show')}else if(q.shown&&e.key==='1')act(t,'no');else if(q.shown&&e.key==='2')act(t,'yes')}
 else if(S.opts.dir[t]==='vi'&&q.res&&e.key==='Enter'){e.preventDefault();act(t,'next')}});
document.addEventListener('keydown',e=>{if(S.opts.tab==='dict'&&e.ctrlKey&&e.code==='Space'){e.preventDefault();DC?say(DC.t):dNext()}});

/* ================= listening ================= */
let lShow=false;
function lHl(i){document.querySelectorAll('#lDet .ln').forEach((el,k)=>el.classList.toggle('cur',k===i))}
function lPlay(L,from,only){if(!('speechSynthesis' in window)){alert('This browser cannot read text aloud.');return}speechSynthesis.cancel();
 const who=[...new Set(L.lines.map(l=>l[0]))],seq=only?[from]:L.lines.map((_,k)=>k).slice(from);
 seq.forEach((k,n)=>{const u=utter(L.lines[k][1],who.indexOf(L.lines[k][0])===1?'B':'A');u.onstart=()=>lHl(k);if(n===seq.length-1)u.onend=()=>lHl(-1);speechSynthesis.speak(u)})}
function listenRender(){const L=LISTEN.find(x=>x.id===S.opts.lsel)||LISTEN[0],who=[...new Set(L.lines.map(l=>l[0]))],r=S.listen[L.id];
 $('lList').innerHTML=LISTEN.map((x,i)=>{const s=S.listen[x.id];return`<button class="gi ${x.id===L.id?'on':''}" data-l="${x.id}"><span>${i+1}. ${esc(x.t)}<small><span class="lvtag l${x.lv}">${LVN[x.lv]}</span> ${esc(x.k)}</small></span><span class="ck ${s&&s.best===100?'y':''}">${s?s.best+'%':''}</span></button>`}).join('');
 $('lDet').innerHTML=`<h3>${esc(L.t)}</h3>${tv(L.t)}<div class="row"><span class="lvtag l${L.lv}">${LVN[L.lv]}</span><span class="mut">${esc(L.k)} · ${L.lines.length} lines${who.length>1?' · '+who.map(esc).join(' & '):''}</span></div>
  <div class="lplayer"><button class="bigplay" id="lAll" title="Play the whole lesson">▶</button><button class="sec" id="lStop">■ Stop</button><button class="sec" id="lSlow">🐢 Slow</button>
   <label><input type="checkbox" id="lTr" ${lShow?'checked':''}> Show transcript</label></div>
  <p class="mut" style="margin:0">Listen first without the transcript, then answer the questions. Click any line to hear it again.</p>
  <div class="lines">${L.lines.map(([w,t],k)=>`<div class="ln" data-k="${k}"><span class="who ${who.indexOf(w)===1?'b':''}">${esc(w)}</span><div class="tx ${lShow?'':'hide'}">${esc(t)}${tv(t)}</div></div>`).join('')}</div>
  <div class="qz" id="lQz"><h2 style="margin:0">Questions</h2>${L.q.map(([q,o],i)=>`<div><div class="q">${i+1}. ${esc(q)}</div>${tv(q)}<div class="opts">${o.map((x,j)=>`<label><input type="radio" name="lq${i}" value="${j}">${esc(x)}</label>`).join('')}</div></div>`).join('')}
  <div class="row"><button class="pri" id="lChk">✓ Check answers</button><button class="ghost" id="lDict">✍️ Practise dictation with this lesson →</button><span id="lMsg" class="mut">${r?`Best score: ${r.best}%`:''}</span></div></div>`;
 $('lAll').onclick=()=>lPlay(L,0);$('lStop').onclick=()=>{speechSynthesis.cancel();lHl(-1)};
 $('lSlow').onclick=()=>{const keep=S.opts.rate;S.opts.rate=Math.max(.5,keep-.25);lPlay(L,0);S.opts.rate=keep};
 $('lTr').onchange=e=>{lShow=e.target.checked;document.querySelectorAll('#lDet .tx').forEach(x=>x.classList.toggle('hide',!lShow))};
 document.querySelectorAll('#lDet .ln').forEach(el=>el.onclick=()=>lPlay(L,+el.dataset.k,true));
 $('lDict').onclick=()=>{S.opts.lvl='listen';$('dLvl').value='listen';tab('dict');dNext()};
 $('lChk').onclick=()=>{let right=0;L.q.forEach(([,o,a],i)=>{document.querySelectorAll(`#lQz input[name=lq${i}]`).forEach(x=>{const l=x.parentNode;l.classList.remove('r','w');if(+x.value===a)l.classList.add('r');else if(x.checked)l.classList.add('w')});
   const c=document.querySelector(`#lQz input[name=lq${i}]:checked`);if(c&&+c.value===a)right++});
  const pct=Math.round(right/L.q.length*100),prev=S.listen[L.id];S.listen[L.id]={best:Math.max(pct,prev?prev.best:0),last:pct,at:dayStr()};bump();save();chips();
  $('lMsg').textContent=pct===100?'🎉 All correct!':`${right}/${L.q.length} correct. The right answers are in green; turn on the transcript to check.`;
  const ck=document.querySelector(`.gi[data-l="${L.id}"] .ck`);if(ck){ck.textContent=S.listen[L.id].best+'%';ck.classList.toggle('y',S.listen[L.id].best===100)}}}
$('lList').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;if(window.speechSynthesis)speechSynthesis.cancel();S.opts.lsel=b.dataset.l;lShow=false;save();listenRender();$('lDet').scrollIntoView({block:'nearest',behavior:'smooth'})};

/* ================= today's lesson ================= */
let tView=todayIdx();
function todayRender(){const n=todayIdx();tView=Math.min(Math.max(0,tView),n);const i=tView,L=lesson(i),dt=new Date();dt.setDate(dt.getDate()-(n-i));
 if(!BW.length){$('t-today').innerHTML='<div class="card">Could not load english-bank.js. Keep it in the same folder as english.html.</div>';return}
 const round=Math.floor(i*2/BW.length)+1,done=!!S.done[i];
 const it=x=>`<div class="item"><div class="big">${esc(x.w)} ${spk(x.w)}</div>${x.p&&!/idiom|phrasal|phrase/.test(x.p)?`<span class="pos">${esc(x.p)}</span>`:''}<div class="mean">${esc(x.m)}</div>${viSpan(x.v)}${x.e?`<div class="ex">${spk(x.e,1)} “${esc(x.e)}”</div>${tv(x.e)}`:''}</div>`;
 const K=(en,vi)=>`<span class="k">${en}</span>${viSpan(vi)}`;
 const opts=L.m?(i%2?[L.m.o,L.m.x]:[L.m.x,L.m.o]):[];
 $('t-today').innerHTML=`<div class="card"><div class="dhead"><div><h2>${i===n?'Today\'s lesson':'Lesson #'+(i+1)}</h2>${viSpan(i===n?'Bài học hôm nay':'Bài học ngày #'+(i+1))}
   <div class="dt">Day ${i+1} · ${dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${round>1?` · Round ${round} (review)`:''}</div></div>
   <div class="nav"><button class="sec" data-nav="-1" ${i===0?'disabled':''} title="Previous lesson">◀</button><button class="sec" data-nav="0" ${i===n?'disabled':''} title="Back to today">●</button><button class="sec" data-nav="1" ${i===n?'disabled':''} title="Next lesson">▶</button></div></div></div>
  <div class="lgrid">
   <div class="lc">${K('📘 New words','Từ mới')}${L.w.map(it).join('')}</div>
   <div class="lc">${K('💬 Idiom','Thành ngữ')}${L.i?it(L.i):''}</div>
   <div class="lc">${K('🔧 Phrasal verb','Cụm động từ')}${L.p?it(L.p):''}</div>
   <div class="lc">${K('✉️ Useful phrase at work','Mẫu câu dùng trong công việc')}${L.s?`<span class="tag">${esc(L.s.c)}</span><div class="big" style="font-size:18px">${esc(L.s.w)} ${spk(L.s.w)}</div>${viSpan(L.s.v)}`:''}</div>
   <div class="lc">${K('⚠️ Common mistake','Lỗi thường gặp')}${L.m?`<div style="font-weight:600">Which sentence is correct?</div>${viSpan('Câu nào đúng?')}<div class="mq" id="mq">${opts.map(o=>`<button data-mq="${o===L.m.o?1:0}">${esc(o)}</button>`).join('')}</div>
     <div id="mqA" hidden><div><span class="wrong">${esc(L.m.x)}</span></div><div><span class="right">✓ ${esc(L.m.o)}</span> ${spk(L.m.o,1)}</div><div class="mut" style="font-size:13.5px">${esc(L.m.m)}</div>${tv(L.m.m)}</div>`:''}</div>
   <div class="lc">${K('✍️ Dictation for this lesson','Chép chính tả theo bài')}<div class="mean">${lessonSentences(i).length} sentences from today's lesson.</div>${viSpan(lessonSentences(i).length+' câu lấy từ bài học hôm nay.')}<button class="pri" id="tDict" style="align-self:flex-start">Practise dictation →</button>
    <span class="k" style="margin-top:6px">🎧 Listening</span>${viSpan('Luyện nghe')}<div class="mean">${(()=>{const x=LISTEN[i%LISTEN.length];return`Suggested: <b>${esc(x.t)}</b> (${LVN[x.lv]})`+tv(x.t)})()}</div><button class="sec" id="tListen" style="align-self:flex-start">Open listening →</button></div>
  </div>
  <div class="card dfoot"><button class="${done?'sec ok-b':'pri'}" id="tDone">${done?'✓ Lesson completed':'✓ Mark lesson as done'}</button>
   <span class="mut">The words, idiom, phrasal verb and phrase from this lesson are added to your review cards in Vocabulary / Idioms. A new lesson opens every day (${BW.length/2} days per round).${viSpan('Từ, idiom, phrasal verb và mẫu câu của bài được thêm vào thẻ ôn ở tab Vocabulary / Idioms. Mỗi ngày mở một bài mới ('+BW.length/2+' ngày mỗi vòng).')}</span></div>`}
$('t-today').addEventListener('click',e=>{const nv=e.target.closest('[data-nav]');
 if(nv){const v=+nv.dataset.nav;tView=v===0?todayIdx():tView+v;todayRender();return}
 const q=e.target.closest('[data-mq]');if(q){document.querySelectorAll('#mq button').forEach(b=>b.classList.add(b.dataset.mq==='1'?'r':'w'));$('mqA').hidden=false;bump();save();chips();return}
 if(e.target.id==='tDict'){S.opts.lvl='today';$('dLvl').value='today';tab('dict');dNext();return}
 if(e.target.id==='tListen'){S.opts.lsel=LISTEN[tView%LISTEN.length].id;lShow=false;tab('listen');return}
 if(e.target.id==='tDone'){if(S.done[tView])delete S.done[tView];else{S.done[tView]=true;bump()}save();chips();todayRender()}});

/* ================= grammar ================= */
let gSel=null;
function gramRender(){if(!gSel)gSel=(GRAM.find(g=>!S.gram[g.id])||GRAM[0]).id;
 $('gList').innerHTML=GRAM.map((g,i)=>`<button class="gi ${g.id===gSel?'on':''}" data-g="${g.id}"><span>${i+1}. ${esc(g.t)}</span><span class="ck ${S.gram[g.id]?'y':''}">${S.gram[g.id]?'✓':''}</span></button>`).join('');
 const g=GRAM.find(x=>x.id===gSel);
 $('gDet').innerHTML=`<h3>${esc(g.t)}</h3>${tv(g.t)}<div class="form">${esc(g.f)}</div><ul>${g.x.map(s=>`<li>${esc(s)}${tv(s)}</li>`).join('')}</ul>
  <div class="exs">${g.ex.map(s=>`<div>${spk(s,1)}<span>${esc(s)}${tv(s)}</span></div>`).join('')}</div>
  <div class="qz" id="gQz"><h2 style="margin:0">Practice</h2>${g.q.map(([q,o],i)=>`<div><div class="q">${i+1}. ${esc(q)}</div><div class="opts">${o.map((x,j)=>`<label><input type="radio" name="q${i}" value="${j}">${esc(x)}</label>`).join('')}</div></div>`).join('')}
  <div class="row"><button class="pri" id="gChk">✓ Check</button><span id="gMsg" class="mut">${S.gram[g.id]?'✓ You have completed this topic.':'Get all answers right to complete this topic.'}</span></div></div>`;
 $('gChk').onclick=()=>{let right=0;g.q.forEach(([,o,a],i)=>{document.querySelectorAll(`#gQz input[name=q${i}]`).forEach(r=>{const l=r.parentNode;l.classList.remove('r','w');if(+r.value===a)l.classList.add('r');else if(r.checked)l.classList.add('w')});
   const c=document.querySelector(`#gQz input[name=q${i}]:checked`);if(c&&+c.value===a)right++});
  bump();const all=right===g.q.length;if(all)S.gram[g.id]=true;save();chips();
  $('gMsg').textContent=all?'🎉 All correct! Topic completed.':`${right}/${g.q.length} correct. The right answers are in green.`;
  const ck=document.querySelector(`.gi[data-g="${g.id}"] .ck`);if(all&&ck){ck.className='ck y';ck.textContent='✓'}}}
$('gList').onclick=e=>{const b=e.target.closest('[data-g]');if(b){gSel=b.dataset.g;gramRender();$('gDet').scrollIntoView({block:'nearest',behavior:'smooth'})}};

/* ================= reset ================= */
$('rst').onclick=()=>{if(!confirm('Reset all learning progress?\n\nThis clears: card levels, dictation and listening results, completed grammar topics, daily lessons and your streak.\nThis keeps: the words, idioms and sentences you added; your voice and speed settings.'))return;
 const keep={custom:S.custom,opts:S.opts};S=Object.assign(DEF(),keep,{start:dayNum()});tView=0;Q.vocab=Q.idiom=null;gSel=null;save();chips();tab(S.opts.tab);
 if(S.opts.tab!=='vocab')deckRender('vocab');if(S.opts.tab!=='idiom')deckRender('idiom');$('dRes').innerHTML=''};

/* ================= init ================= */
function renderAll(){chips();deckRender('vocab');deckRender('idiom');tab(S.opts.tab||'today',true)}   /* no save on load, so an older browser copy never outruns qe_data.json */
renderAll();
(async()=>{if(HOST){svSet('✓ Progress saved to your account');return}try{const h=await qeHandle(false);if(!h){svSet('Saved in this browser · click to connect qe_data.json');return}
 const j=await qeRead(h),d=j&&j.eng;
 if(d&&(d.savedAt||0)>(S.savedAt||0)){S=fill(d);if(!S.start)S.start=dayNum();tView=todayIdx();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}$('dLvl').value=S.opts.lvl;$('rate').value=S.opts.rate;$('dMy').value=S.custom.dict;myN();applyVi();
  ['vocab','idiom'].forEach(k=>$(k+'-dir').value=S.opts.dir[k]);if(VO.length)loadVoices();renderAll();svSet('Loaded from qe_data.json')}
 else if(!d||(S.savedAt||0)>(d.savedAt||0))await fileSave(false);else svSet('Saved · qe_data.json')}catch(e){svSet('⚠ qe_data.json has an error, not overwritten: '+(e.message||e),'er')}})();
$('sv').onclick=()=>fileSave(true);
})();
</script></body></html>
